<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مساعد الشركة</title>
  <style>
    :root { --brand: #2563eb; --bg: #f4f5f7; --bot: #ffffff; --user: #2563eb; }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      font-family: system-ui, "Segoe UI", Tahoma, sans-serif; background: var(--bg);
    }
    header {
      background: var(--brand); color: #fff; padding: 14px 18px;
      font-weight: 600; font-size: 17px; flex: 0 0 auto;
    }
    #chat {
      flex: 1 1 auto; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; line-height: 1.6;
           white-space: pre-wrap; word-wrap: break-word; }
    .user { align-self: flex-start; background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
    .bot  { align-self: flex-end; background: var(--bot); color: #111; border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .dots { align-self: flex-end; color: #888; font-style: italic; }
    form { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #e5e7eb; flex: 0 0 auto; }
    input {
      flex: 1; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 10px;
      font-size: 15px; outline: none;
    }
    input:focus { border-color: var(--brand); }
    button {
      background: var(--brand); color: #fff; border: 0; border-radius: 10px;
      padding: 0 20px; font-size: 15px; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header>💬 مساعد الشركة</header>
  <div id="chat">
    <div class="msg bot">مرحباً! أنا مساعد الشركة. اسألني وأجاوبك من معلوماتنا. كيف أقدر أساعدك؟</div>
  </div>
  <form id="form">
    <input id="input" placeholder="اكتب سؤالك هنا..." autocomplete="off" />
    <button id="send" type="submit">إرسال</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const history = [];

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + (role === "user" ? "user" : "bot");
      div.textContent = text; // textContent -> safe against HTML injection
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage("user", text);
      history.push({ role: "user", content: text });
      input.value = "";
      send.disabled = true;

      const typing = document.createElement("div");
      typing.className = "dots";
      typing.textContent = "يكتب…";
      chat.appendChild(typing);
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        typing.remove();
        addMessage("bot", data.reply);
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        typing.remove();
        addMessage("bot", "عذراً، صار خطأ في الاتصال. حاول مرة ثانية.");
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
